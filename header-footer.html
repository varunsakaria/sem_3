<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,intial-scale=1.0">
    <title>Solar Explorer - Header & Footer Structure</title>
    <style>
      * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

    body {
            font-family: Arial, sans-serif;
            background-color: #060713;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

    header {
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

    .logo {
            font-size: 22px;
            font-weight: bold;
            color: #818cf8;
            letter-spacing: 1px;
        }

    nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

    nav a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

    nav a:hover {
            color: #ffffff;
        }

    main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: #64748b;
            font-style: italic;
        }

    footer {
            background: rgba(0,0,0,0.4);
            border-top: 1 px solid rgba(255,255,255,0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #94a3b8;
         }

    .tech-tags span {
            background: rgba(129,140,248,0.1);
            color: #818cf8;
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 5px;
            font-size: 11 px;
         }
    </style>
</head>
<body>
    <header>
        <div class="logo">🚀 Solar Explorer</div>
        <nav>
            <ul>
                <li><a href="#">Overview</a></li>
                <li><a href="#">Planets</a></li>
                <li><a href="#">Calculator</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <p>[ Body Content Area - Planet Views & Calculators Go Here ]</p>
    </main>

    <footer>
        <div>
            © 2026 Sakaria Varun | Enroll No:45 (BCA Sem 3) 
        </div>
        <div class="tech-tags">
            Built with:
            <span>HTML5</span>
            <span>CSS3</span>
            <span>JavaScript</span>
        </div>
    </footer>

</body>
</html>
